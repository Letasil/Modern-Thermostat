name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix (for example 2.6.1)"
        required: true
        default: "2.6.1"
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify release version and package files
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import os
          import re
          version = os.environ["INPUT_VERSION"]
          declared = Path("VERSION.txt").read_text(encoding="utf-8").strip()
          root = Path("modern-thermostat.js").read_bytes()
          dist = Path("dist/modern-thermostat.js").read_bytes()
          text = root.decode("utf-8")
          match = re.search(r"""const\s+Dt\s*=\s*["']([^"']+)["']""", text)
          if version != declared or not match or match.group(1) != version:
              raise SystemExit("Release input, VERSION.txt, and JavaScript version must match")
          if root != dist:
              raise SystemExit("Root and dist JavaScript files differ")
          manifest = json.loads(Path("hacs.json").read_text(encoding="utf-8"))
          if manifest.get("filename") != "modern-thermostat.js" or manifest.get("content_in_root") is not False:
              raise SystemExit("Marketplace filename/content_in_root mismatch")
          embedded_match = re.search(r"const MT_TRANSLATION_EMBEDDED=(\{.*?\});", text)
          if not embedded_match:
              raise SystemExit("Embedded translations are missing")
          embedded = json.loads(embedded_match.group(1))
          source = {p.stem: json.loads(p.read_text(encoding="utf-8")) for p in Path("translations").glob("*.json")}
          if not source or embedded != source:
              raise SystemExit("Embedded translations differ from JSON sources")
          PY
      - name: Create release archive
        run: zip -r modern-thermostat-v${{ inputs.version }}.zip modern-thermostat.js translations
      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: modern-thermostat V${{ inputs.version }}
          body_path: GITHUB_RELEASE_NOTES.md
          draft: true
          files: |
            modern-thermostat.js
            modern-thermostat-v${{ inputs.version }}.zip
