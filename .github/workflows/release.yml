name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix (for example 2.5.0)"
        required: true
        default: "2.5.0"
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create release archive
        run: cd dist && zip -r ../modern-thermostat-v${{ inputs.version }}.zip modern-thermostat.js translations
      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: modern-thermostat V${{ inputs.version }}
          body_path: GITHUB_RELEASE_NOTES.md
          draft: true
          files: modern-thermostat-v${{ inputs.version }}.zip