<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Modern Thermostat standard view with built-in trend</title>
  <desc id="desc">A dark Home Assistant thermostat card with humidity, glass controls, temperature trend fill and a setpoint history line.</desc>
  <defs>
    <linearGradient id="page" x2="0" y2="1"><stop stop-color="#17191c"/><stop offset="1" stop-color="#0e1012"/></linearGradient>
    <linearGradient id="card" x2="0" y2="1"><stop stop-color="#252628"/><stop offset="1" stop-color="#1a1b1d"/></linearGradient>
    <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#717274" stop-opacity=".85"/><stop offset=".48" stop-color="#434446" stop-opacity=".86"/><stop offset="1" stop-color="#292a2c" stop-opacity=".96"/></linearGradient>
    <linearGradient id="heatFill" x2="0" y2="1"><stop stop-color="#ed145b" stop-opacity=".56"/><stop offset="1" stop-color="#ed145b" stop-opacity=".06"/></linearGradient>
    <linearGradient id="heatLine" x1="0" x2="1"><stop stop-color="#4f68ff"/><stop offset=".48" stop-color="#c8008d"/><stop offset="1" stop-color="#ff3344"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".38"/></filter>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#page)"/>
  <circle cx="186" cy="152" r="142" fill="#ff6b35" opacity=".035"/>
  <g filter="url(#shadow)">
    <rect x="252" y="24" width="696" height="672" rx="28" fill="url(#card)" stroke="#3a3b3d" stroke-width="2"/>
    <circle cx="302" cy="78" r="23" fill="#343537"/>
    <path d="M303 62c3 8-4 10-2 16 1 3 4 4 6 2 3-3 2-7 0-10 7 4 10 12 5 18-5 7-17 5-20-2-3-7 1-14 11-24Z" fill="#ff7043"/>
    <text x="338" y="73" fill="#f1f1f2" font-family="Arial,sans-serif" font-size="21" font-weight="700">Living room</text>
    <circle cx="343" cy="96" r="4" fill="#ff7043"/>
    <text x="355" y="101" fill="#b8b9bb" font-family="Arial,sans-serif" font-size="15">Heating</text>
    <rect x="786" y="83" width="127" height="34" rx="17" fill="url(#glass)" stroke="#68696a"/>
    <path d="M804 95c0-3 2-5 5-5s5 2 5 5v8h-10Z" fill="none" stroke="#29b6f6" stroke-width="1.8"/>
    <path d="M809 92v5m-3 3h6" stroke="#29b6f6" stroke-width="1.6" stroke-linecap="round"/>
    <text x="822" y="105" fill="#e6e7e8" font-family="Arial,sans-serif" font-size="14" font-weight="700">56 %RH</text>
    <text x="523" y="236" fill="#f0f0f2" font-family="Arial,sans-serif" font-size="96" font-weight="300" text-anchor="middle">21.6</text>
    <text x="629" y="185" fill="#bcbec1" font-family="Arial,sans-serif" font-size="28">°C</text>
    <g font-family="Arial,sans-serif" font-size="17" font-weight="600" text-anchor="middle">
      <rect x="284" y="282" width="196" height="52" rx="26" fill="url(#glass)" stroke="#77787a"/>
      <path d="M314 301c3 5-2 6-1 10 1 2 3 2 4 1 2-2 1-4 0-6 4 2 6 6 3 10-3 4-9 3-11-1-2-4 1-8 5-14Z" fill="#ff7043"/>
      <text x="394" y="315" fill="#ff895f">Heat⌄</text>
      <rect x="500" y="282" width="196" height="52" rx="26" fill="url(#glass)" stroke="#77787a"/>
      <path d="M531 299v19m-5-14h10m-8-4a3 3 0 1 0 6 0 3 3 0 0 0-6 0" fill="none" stroke="#c8c9ca" stroke-width="2" stroke-linecap="round"/>
      <text x="606" y="315" fill="#dedfe0">21.0°C⌄</text>
      <rect x="716" y="282" width="196" height="52" rx="26" fill="url(#glass)" stroke="#77787a"/>
      <path d="M746 313v-15m0 15h20m-18-4 6-7 5 4 7-10" fill="none" stroke="#42a5f5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="830" y="315" fill="#e7e8e9">Trend</text>
    </g>
    <text x="284" y="387" fill="#9b9da0" font-family="Arial,sans-serif" font-size="14">Min.</text>
    <text x="284" y="410" fill="#e4e5e6" font-family="Arial,sans-serif" font-size="17" font-weight="600">18.3 °C</text>
    <text x="284" y="432" fill="#9b9da0" font-family="Arial,sans-serif" font-size="14">09:00</text>
    <text x="912" y="387" fill="#9b9da0" font-family="Arial,sans-serif" font-size="14" text-anchor="end">Max.</text>
    <text x="912" y="410" fill="#e4e5e6" font-family="Arial,sans-serif" font-size="17" font-weight="600" text-anchor="end">22.4 °C</text>
    <text x="912" y="432" fill="#9b9da0" font-family="Arial,sans-serif" font-size="14" text-anchor="end">23:23</text>
    <path d="M270 560 C315 560 328 547 356 537 S405 549 431 517 S470 525 498 531 S537 548 561 558 S601 574 629 566 S668 584 697 572 S737 548 768 554 S813 538 838 532 S881 508 929 506 L929 674 L270 674Z" fill="url(#heatFill)"/>
    <path d="M270 560 C315 560 328 547 356 537 S405 549 431 517 S470 525 498 531 S537 548 561 558 S601 574 629 566 S668 584 697 572 S737 548 768 554 S813 538 838 532 S881 508 929 506" fill="none" stroke="url(#heatLine)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M270 542 C360 542 430 544 510 543 S674 545 751 544 S865 543 929 543" fill="none" stroke="#ffb74d" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="929" cy="506" r="4.5" fill="#ff3344"/>
    <circle cx="929" cy="543" r="4" fill="#ffb74d"/>
    <g transform="translate(396 650)" font-family="Arial,sans-serif" font-size="13">
      <circle cx="0" cy="0" r="5" fill="#c8008d"/><text x="12" y="5" fill="#aeb0b2">Temperature</text>
      <circle cx="133" cy="0" r="5" fill="#ffb74d"/><text x="145" y="5" fill="#aeb0b2">Setpoint history</text>
    </g>
  </g>
</svg>
