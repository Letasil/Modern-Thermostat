<svg xmlns="http://www.w3.org/2000/svg" width="980" height="390" viewBox="0 0 980 390" role="img" aria-labelledby="title desc">
  <title id="title">Modern Thermostat compact mode</title>
  <desc id="desc">Compact thermostat card showing only room status, temperature, available humidity and the HVAC and setpoint controls.</desc>
