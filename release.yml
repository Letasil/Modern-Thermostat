name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release-Tag, z. B. v2.4.0"
        required: true
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate
        run: node --check dist/modern-thermostat.js
      - name: Create release archive
        run: cd dist && zip -r ../modern-thermostat-${{ inputs.tag }}.zip modern-thermostat.js translations
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          generate_release_notes: true
          files: modern-thermostat-${{ inputs.tag }}.zip
